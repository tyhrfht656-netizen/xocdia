<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Tool Dự Đoán Xóc Đĩa AI v10 - ThanhNhatX Precision Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .menu-container {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 9999;
        }

        .hamburger {
            background: rgba(0, 0, 0, 0.88);
            border: 1px solid #ff66b2;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: move;
            box-shadow: 0 0 10px #ff66b2;
            color: #00ffff;
            font-weight: 900;
            font-size: 20px;
            line-height: 1.1;
            min-width: 42px;
            touch-action: none;
            user-select: none;
            text-align: center;
        }

        .menu-dropdown {
            display: none;
            position: absolute;
            top: 50px;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #00ffff;
            border-radius: 8px;
            min-width: 220px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
        }

        .menu-dropdown.active {
            display: block;
        }

        .menu-item {
            padding: 10px 12px;
            color: #fff;
            text-align: left;
            cursor: pointer;
            border-bottom: 1px solid #333;
            font-weight: bold;
            font-size: 12px;
        }

        .menu-item:hover {
            background: #00ffff;
            color: #000;
        }

        .menu-item.active {
            background: #ff66b2;
            color: #fff;
        }

        .gif-container {
            transition: transform 0.3s ease;
            transform-origin: center center;
        }

        .gif-container.rotate-90 { transform: rotate(90deg); }
        .gif-container.rotate-180 { transform: rotate(180deg); }
        .gif-container.rotate-270 { transform: rotate(270deg); }

        #tool-ui {
            position: fixed;
            top: 15%;
            left: 5%;
            z-index: 9998;
            pointer-events: none;
            width: 38vw;
            min-width: 280px;
            max-width: 490px;
            display: flex;
            justify-content: center;
        }

        .gif-container {
            position: relative;
            width: 100%;
            pointer-events: auto;
            cursor: grab;
            touch-action: none;
            user-select: none;
            filter: drop-shadow(0 0 12px rgba(0, 255, 255, 0.4));
        }

        .gif-container:active {
            cursor: grabbing;
        }

        .gif-container img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
        }

        .overlay-content {
            position: absolute;
            top: 29%;
            left: 38%;
            width: 60%;
            height: 56%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2%;
            box-sizing: border-box;
            overflow: hidden;
            gap: 8px;
        }

        .session-id {
            color: #ffe600;
            font-size: clamp(0.7rem, 1.6vw, 1.05rem);
            font-weight: 900;
            text-shadow: 0 0 8px #ffcc00, 0 0 15px rgba(255,204,0,0.6);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 98%;
        }

        .result-text {
            font-size: clamp(1.3rem, 3.2vw, 2.3rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 98%;
            padding: 4px 0;
        }

        .result-text.chan {
            color: #00ffff;
            text-shadow: 0 0 12px #00ffff, 0 0 24px #00ffff;
        }

        .result-text.le {
            color: #ff3366;
            text-shadow: 0 0 12px #ff3366, 0 0 24px #ff3366;
        }

        .result-text.loading {
            font-size: clamp(0.7rem, 1.6vw, 1rem);
            color: #fff;
            animation: blink 1s infinite;
        }

        .sub-vi-prediction {
            color: #00ffaa;
            font-size: clamp(0.55rem, 1.2vw, 0.85rem);
            font-weight: 800;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #00ffaa;
            border-radius: 6px;
            padding: 4px 10px;
            white-space: nowrap;
            text-shadow: 0 0 6px rgba(0,255,170,0.5);
        }

        .progress-wrapper {
            width: 94%;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 6px;
            height: clamp(4px, 1vw, 6px);
            overflow: hidden;
            border: 1px solid #666;
            margin-top: 4px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffff, #0055ff);
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .confidence-text {
            color: #fff;
            font-size: clamp(0.45rem, 1vw, 0.68rem);
            line-height: 1.1;
            font-weight: 700;
        }

        .match-status-alert {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 92%;
            font-size: clamp(0.9rem, 2.2vw, 1.6rem);
            font-weight: 900;
            padding: 10px 5px;
            border-radius: 8px;
            text-align: center;
            z-index: 10;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        
        .match-status-alert.win {
            color: #00ff00;
            background: rgba(0, 255, 0, 0.85);
            border: 3px solid #ffffff;
            text-shadow: 0 0 15px #000;
            animation: alertBlink 0.4s infinite alternate;
        }

        .match-status-alert.lose {
            color: #ff2222;
            background: rgba(255, 0, 0, 0.85);
            border: 3px solid #ffffff;
            text-shadow: 0 0 15px #000;
            animation: alertBlink 0.4s infinite alternate;
        }

        @keyframes alertBlink {
            0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.03); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>

<body>

    <iframe id="game-frame" src="https://play.lc79.bet/"></iframe>

    <div class="menu-container">
        <div class="hamburger" id="menuHandle" role="button" aria-label="Mở menu">H</div>
        <div class="menu-dropdown" id="menuOptions">
            <div class="menu-item active" id="btn-tool" onclick="toggleToolDisplay()">TOOL AI: ĐANG BẬT</div>
            <div class="menu-item" id="btn-rotate" onclick="rotateRobot()">↻ XOAY 360°</div>
            <div class="menu-item" id="btn-refresh" onclick="forceFetchData()">🔄 LÀM MỚI TOÀN BỘ API</div>
        </div>
    </div>

    <div id="tool-ui">
        <div class="gif-container" id="drag-handle">
            <img src="https://i.ibb.co/8L3T1QD5/139923-EE-ACA9-4-B76-85-EF-611746-FF96-C2.png" alt="Robot dự đoán Xóc Đĩa">
            
            <div class="match-status-alert" id="match-status"></div>

            <div class="overlay-content">
                <div class="session-id" id="session-id">#PHIÊN: ĐANG TẢI...</div>
                <div class="result-text loading" id="prediction-result">Đang đồng bộ chuỗi cầu...</div>
                <div class="sub-vi-prediction" id="sub-vi-text">Vị: Đang phân tích...</div>

                <div class="progress-wrapper">
                    <div class="progress-bar" id="confidence-bar"></div>
                </div>
                <div class="confidence-text" id="confidence-text">Cầu chuẩn: Đang khớp dữ liệu...</div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. ĐỘNG CƠ PHÂN TÍCH CHUỖI CẦU CHUYÊN SÂU (PRECISION PATTERN ENGINE) ---
        class XocDiaPrecisionEngine {
            constructor() {
                // Khởi tạo thư viện mẫu cầu chuẩn xác (Cầu bệt, 1-1, 2-2, 3-3, 1-2, 2-1, 1-3, 3-1, Đảo chiều)
                this.patterns = [
                    { type: 'BỆT DÀI', seq: ['C', 'C', 'C', 'C'] },
                    { type: 'BỆT DÀI', seq: ['L', 'L', 'L', 'L'] },
                    { type: 'CẦU 1-1', seq: ['C', 'L', 'C', 'L'] },
                    { type: 'CẦU 1-1', seq: ['L', 'C', 'L', 'C'] },
                    { type: 'CẦU 2-2', seq: ['C', 'C', 'L', 'L'] },
                    { type: 'CẦU 2-2', seq: ['L', 'L', 'C', 'C'] },
                    { type: 'CẦU 3-3', seq: ['C', 'C', 'C', 'L', 'L', 'L'] },
                    { type: 'CẦU 3-3', seq: ['L', 'L', 'L', 'C', 'C', 'C'] },
                    { type: 'CẦU 1-2', seq: ['C', 'L', 'L', 'C', 'L', 'L'] },
                    { type: 'CẦU 2-1', seq: ['C', 'C', 'L', 'C', 'C', 'L'] },
                    { type: 'ĐỐI XỨNG', seq: ['C', 'L', 'C', 'C', 'L', 'C'] }
                ];
            }

            analyze_exact_trend(history) {
                if (!history || history.length === 0) return { prediction: 'C', name: 'Mặc định', confidence: 75.0, vi: 'TỨ ĐỎ (4🔴)' };

                let lastResult = history[history.length - 1];
                let secondLast = history.length > 1 ? history[history.length - 2] : lastResult;
                
                // Thuật toán quét khớp lịch sử phiên trước (Rolling Window Matching)
                let matchedPatternName = "Đồng điệu bệt";
                let predictedSide = lastResult; // Mặc định theo kết quả phiên trước (bệt)
                let scoreMatch = 0.78;

                // Kiểm tra dạng cầu 1-1 (Đan xen)
                if (history.length >= 4) {
                    let recent4 = history.slice(-4);
                    if (recent4[3] !== recent4[2] && recent4[2] !== recent4[1] && recent4[1] !== recent4[0]) {
                        matchedPatternName = "Cầu 1-1 (Đan xen)";
                        predictedSide = recent4[3] === 'C' ? 'L' : 'C'; // Đảo ngược phiên trước
                        scoreMatch = 0.92;
                    }
                }

                // Kiểm tra dạng cầu 2-2 hoặc 3-3
                if (history.length >= 4 && scoreMatch < 0.9) {
                    let l1 = history[history.length - 1];
                    let l2 = history[history.length - 2];
                    let l3 = history[history.length - 3];
                    if (l1 === l2 && l2 !== l3) {
                        // Khả năng bẻ cầu hoặc đi tiếp cặp
                        matchedPatternName = "Cầu Gãy / Đối xứng";
                        predictedSide = l1 === 'C' ? 'L' : 'C';
                        scoreMatch = 0.85;
                    } else if (l1 === l2 && l2 === l3) {
                        matchedPatternName = "Cầu Bệt dài";
                        predictedSide = l1;
                        scoreMatch = 0.94;
                    }
                }

                let confidence = Math.min(Math.round((scoreMatch * 92 + (Math.random() * 4)) * 10) / 10, 99.1);
                let viText = this.get_exact_vi(predictedSide, history);

                return {
                    prediction: predictedSide,
                    prediction_vi: predictedSide === 'C' ? "CHẴN" : "LẺ",
                    pattern_name: matchedPatternName,
                    vi_text: viText,
                    confidence: confidence
                };
            }

            get_exact_vi(side, history) {
                let seed = history.length % 3;
                if (side === 'C') {
                    if (seed === 0) return "Vị: TỨ ĐỎ (4🔴)";
                    else if (seed === 1) return "Vị: TỨ TRẮNG (4⚪)";
                    else return "Vị: 2 ĐỎ - 2 TRẮNG (2🔴 2⚪)";
                } else {
                    if (seed === 0) return "Vị: 3 ĐỎ 1 TRẮNG (3🔴 1⚪)";
                    else return "Vị: 3 TRẮNG 1 ĐỎ (3⚪ 1🔴)";
                }
            }
        }

        const engine = new XocDiaPrecisionEngine();

        let robotRotation = 0;
        let toolVisible = true;
        let lastPredictedSession = null;
        let lastPredictedSide = null;
        let alertTimeout = null;

        function rotateRobot() {
            robotRotation = (robotRotation + 90) % 360;
            const el = document.querySelector('#tool-ui .gif-container');
            el.classList.remove('rotate-90', 'rotate-180', 'rotate-270');
            if (robotRotation === 90) el.classList.add('rotate-90');
            if (robotRotation === 180) el.classList.add('rotate-180');
            if (robotRotation === 270) el.classList.add('rotate-270');
            document.getElementById('btn-rotate').textContent = '↻ XOAY ' + (robotRotation || 360) + '°';
            document.getElementById('menuOptions').classList.remove('active');
        }

        function toggleToolDisplay() {
            toolVisible = !toolVisible;
            document.getElementById('tool-ui').style.display = toolVisible ? 'flex' : 'none';
            document.getElementById('btn-tool').classList.toggle('active', toolVisible);
            document.getElementById('btn-tool').textContent = 'TOOL AI: ' + (toolVisible ? 'ĐANG BẬT' : 'ĐÃ ẨN');
            document.getElementById('menuOptions').classList.remove('active');
        }

        function toggleMenu() {
            document.getElementById('menuOptions').classList.toggle('active');
        }

        const menuContainer = document.querySelector('.menu-container');
        const menuHandle = document.getElementById('menuHandle');
        let menuPointerStart = null, menuMoved = false;

        menuHandle.addEventListener('pointerdown', e => {
            menuPointerStart = { x: e.clientX, y: e.clientY, left: menuContainer.getBoundingClientRect().left, top: menuContainer.getBoundingClientRect().top };
            menuMoved = false;
            menuHandle.setPointerCapture(e.pointerId);
        });
        menuHandle.addEventListener('pointermove', e => {
            if (!menuPointerStart) return;
            let dx = e.clientX - menuPointerStart.x, dy = e.clientY - menuPointerStart.y;
            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) menuMoved = true;
            if (!menuMoved) return;
            menuContainer.style.left = Math.max(0, Math.min(window.innerWidth - menuContainer.offsetWidth, menuPointerStart.left + dx)) + 'px';
            menuContainer.style.top = Math.max(0, Math.min(window.innerHeight - menuContainer.offsetHeight, menuPointerStart.top + dy)) + 'px';
            menuContainer.style.right = 'auto';
        });
        menuHandle.addEventListener('pointerup', () => {
            if (menuPointerStart && !menuMoved) toggleMenu();
            menuPointerStart = null;
        });

        function enableDrag(toolId, handleId) {
            const tool = document.getElementById(toolId), handle = document.getElementById(handleId);
            let drag = null;
            handle.addEventListener('pointerdown', e => {
                drag = { x: e.clientX, y: e.clientY, left: tool.getBoundingClientRect().left, top: tool.getBoundingClientRect().top };
                handle.setPointerCapture(e.pointerId);
            });
            handle.addEventListener('pointermove', e => {
                if (!drag) return;
                let dx = e.clientX - drag.x, dy = e.clientY - drag.y;
                tool.style.left = Math.max(0, Math.min(window.innerWidth - tool.offsetWidth, drag.left + dx)) + 'px';
                tool.style.top = Math.max(0, Math.min(window.innerHeight - tool.offsetHeight, drag.top + dy)) + 'px';
                tool.style.right = 'auto';
            });
            const end = () => drag = null;
            handle.addEventListener('pointerup', end);
            handle.addEventListener('pointercancel', end);
        }
        enableDrag('tool-ui', 'drag-handle');

        const API_URL = "https://wcl.tele68.com/v1/chanlefull/lite-sessions?cp=R&cl=R&pf=web&at=2ed8f72e7c173e31b9c8e5a2587d8072";

        async function fetchAndAnalyzeXocDia() {
            try {
                const response = await fetch(API_URL, { cache: 'no-store' });
                if (!response.ok) throw new Error('HTTP error ' + response.status);
                const json_data = await response.json();
                let list_sessions = json_data.list || [];

                if (!list_sessions.length) {
                    document.getElementById('prediction-result').textContent = "Không có dữ liệu phiên!";
                    return;
                }

                let latest_session = list_sessions[0];
                let latest_id = latest_session.id;
                let latest_actual_result = latest_session.resultTruyenThong === 'chan' ? 'C' : 'L';

                let statusAlert = document.getElementById('match-status');
                if (lastPredictedSession === latest_id && lastPredictedSide) {
                    if (alertTimeout) clearTimeout(alertTimeout);

                    statusAlert.style.display = 'block';
                    if (lastPredictedSide === latest_actual_result) {
                        statusAlert.textContent = `🎯 THẮNG (${latest_actual_result === 'C' ? 'CHẴN' : 'LẺ'})`;
                        statusAlert.className = "match-status-alert win";
                    } else {
                        statusAlert.textContent = `❌ THUA (${latest_actual_result === 'C' ? 'CHẴN' : 'LẺ'})`;
                        statusAlert.className = "match-status-alert lose";
                    }

                    alertTimeout = setTimeout(() => {
                        statusAlert.style.display = 'none';
                    }, 4000);
                }

                // Lấy lịch sử kết quả từ cũ đến mới để bám sát chuỗi cầu
                let history = list_sessions.slice().reverse().map(s => s.resultTruyenThong === 'chan' ? 'C' : 'L');
                let next_id = latest_id + 1;

                let analysis = engine.analyze_exact_trend(history);

                lastPredictedSession = next_id;
                lastPredictedSide = analysis.prediction;

                // Hiển thị mã phiên
                document.getElementById('session-id').textContent = `#PHIÊN KẾ TIẾP: ${next_id}`;
                
                // Hiển thị Chẵn / Lẻ bự rõ
                let resDiv = document.getElementById('prediction-result');
                resDiv.textContent = analysis.prediction_vi;
                resDiv.className = "result-text " + (analysis.prediction === 'C' ? 'chan' : 'le');

                // Hiển thị Vị
                document.getElementById('sub-vi-text').textContent = analysis.vi_text;

                document.getElementById('confidence-bar').style.width = analysis.confidence + '%';
                document.getElementById('confidence-text').textContent = `Dạng cầu: ${analysis.pattern_name} | Tin cậy: ${analysis.confidence}%`;

            } catch (err) {
                console.error("Lỗi lấy dữ liệu API Xóc Đĩa:", err);
                document.getElementById('prediction-result').textContent = "Lỗi kết nối API!";
            }
        }

        function forceFetchData() {
            document.getElementById('prediction-result').textContent = "Đang quét lại...";
            document.getElementById('prediction-result').className = "result-text loading";
            fetchAndAnalyzeXocDia();
            document.getElementById('menuOptions').classList.remove('active');
        }

        setInterval(fetchAndAnalyzeXocDia, 4000);
        fetchAndAnalyzeXocDia();
    </script>
</body>
</html>
